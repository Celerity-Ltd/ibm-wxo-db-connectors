<style>
  /* ── Architecture lanes ── */
  .arch-outer {
    display: flex;
    flex-direction: column;
  }
  .arch-flow-row {
    border-radius: 16px;
  }
  .arch-bracket-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 0;
  }
  .arch-bracket-wrap svg {
    display: block;
    width: 100%;
    overflow: visible;
  }
  .arch-control-band {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 0 0;
  }
  .arch-control-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #3ddc97;
    white-space: nowrap;
  }
  .arch-lane {
    display: flex;
    align-items: center;
    gap: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 28px 32px;
  }
  .arch-control {
    border-left: 4px solid #3ddc97;
    background: rgba(61,220,151,0.04);
    border-color: rgba(61,220,151,0.2);
  }
  .lane-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    min-width: 100px;
  }
  .lane-flow {
    display: flex;
    align-items: center;
    gap: 0;
    flex: 1;
  }
  .lane-box {
    flex: 1;
    background: #1a2133;
    border: 1px solid #1e3a5f;
    border-radius: 14px;
    padding: 26px 16px;
    text-align: center;
    color: var(--white);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
  }
  .lane-box.lane-highlight {
    background: #1a2133;
    border-color: #4589ff;
    border-width: 2px;
    color: #fff;
  }
  .lane-arrow {
    color: rgba(255,255,255,0.4);
    font-size: 20px;
    padding: 0 14px;
    flex-shrink: 0;
  }
  .lane-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .arch-pill {
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
  }
</style>
